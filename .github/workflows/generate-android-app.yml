name: Generate Android App
run-name: "Generate Android App · ${{ inputs.instrument }} · versionName ${{ inputs.version_name }} · versionCode ${{ inputs.version_code }} · ${{ inputs.publish }}"

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (bass-4 = bass; all = all three applications)"
        required: true
        default: guitar
        type: choice
        options: [guitar, bass-4, ukulele, all]
      publish:
        description: "Google Play destination (build-only keeps the signed downloads)"
        type: choice
        required: true
        default: build-only
        options: [build-only, internal, production]
      version_code:
        description: "Android versionCode (integer, higher than the last Play upload)"
        required: true
        type: string
      version_name:
        description: "Public version name (e.g. 1.1.0)"
        required: true
        default: "1.0.0"
        type: string

# Avoid overlapping updates to the rolling Android release.
concurrency:
  group: android-distribution
  cancel-in-progress: false

env:
  POWERSHELL_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  build:
    runs-on: windows-latest
    outputs:
      play-matrix: ${{ steps.release-notes.outputs.matrix }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate build inputs
        shell: pwsh
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_INSTRUMENT: ${{ inputs.instrument }}
        run: |
          if ($env:BUILD_INSTRUMENT -notin @('guitar', 'bass-4', 'ukulele', 'all')) {
            throw "instrument must be guitar, bass-4, ukulele or all"
          }
          if ($env:VERSION_CODE -notmatch '^[1-9][0-9]{0,9}$' -or [long]$env:VERSION_CODE -gt 2100000000) {
            throw "version_code must be an integer between 1 and 2100000000"
          }
          if ($env:VERSION_NAME -notmatch '^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9]+)*$') {
            throw "version_name must look like 1.0 or 1.0.0"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Play destination and localized release notes
        id: release-notes
        if: inputs.publish != 'build-only'
        shell: pwsh
        env:
          PLAY_TRACK: ${{ inputs.publish }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_INSTRUMENT: ${{ inputs.instrument }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Select main to publish to Google Play.' }
          if ($env:PLAY_TRACK -notin @('internal', 'production')) { throw 'Invalid Play track.' }
          node scripts/google-play/notes.cjs

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Disable Android tool analytics before setup
        shell: pwsh
        run: |
          $androidHome = Join-Path $env:USERPROFILE '.android'
          New-Item -ItemType Directory -Path $androidHome -Force | Out-Null
          $settings = @{
            userId = [guid]::NewGuid().ToString()
            optedIn = $false
            saltValue = [guid]::NewGuid().ToString()
            saltSkew = 0
            debugDisablePublishing = $true
          }
          $settings | ConvertTo-Json | Set-Content (Join-Path $androidHome 'analytics.settings') -Encoding utf8NoBOM

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }

      - name: Install app dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Disable Capacitor telemetry
        working-directory: app
        run: node node_modules/@capacitor/cli/bin/capacitor telemetry off

      - name: Set up release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing secret: $name" }
          }
          # Java .properties interprets backslashes, whitespace and Unicode escapes.
          function Escape-Property([string]$value) {
            $escaped = foreach ($char in $value.ToCharArray()) { '\u{0:x4}' -f [int]$char }
            return ($escaped -join '')
          }
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("app/android/app/release.keystore", $bytes)
          $lines = @(
            'storeFile=release.keystore'
            "storePassword=$(Escape-Property $env:ANDROID_KEYSTORE_PASSWORD)"
            "keyAlias=$(Escape-Property $env:ANDROID_KEY_ALIAS)"
            "keyPassword=$(Escape-Property $env:ANDROID_KEY_PASSWORD)"
          )
          [IO.File]::WriteAllLines("app/android/keystore.properties", $lines, [Text.UTF8Encoding]::new($false))

      - name: Build selected applications (release, signed)
        shell: pwsh
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_INSTRUMENT: ${{ inputs.instrument }}
        run: |
          $buildOptions = @{
            Profile = 'Store'
            BuildType = 'Release'
            VersionCode = $env:VERSION_CODE
            VersionName = $env:VERSION_NAME
          }
          if ($env:BUILD_INSTRUMENT -eq 'all') {
            .\scripts\build-all.ps1 @buildOptions
          } else {
            .\scripts\build-instrument.ps1 -Instrument $env:BUILD_INSTRUMENT @buildOptions
          }

      - name: Remove signing files
        if: always()
        shell: pwsh
        run: |
          Remove-Item app/android/keystore.properties, app/android/app/release.keystore -Force -ErrorAction SilentlyContinue

      - name: Upload signed bundles and R8 mappings
        uses: actions/upload-artifact@v7
        with:
          name: fretboard-hero-android-${{ inputs.instrument }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            dist/*.aab
            dist/*-mapping.txt
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "Android App Bundles"
          body: |
            Signed Android App Bundles built from commit ${{ github.sha }}.
            Version ${{ inputs.version_name }} (code ${{ inputs.version_code }}).
            Instrument selection: ${{ inputs.instrument }} (all = Guitar, Bass and Ukulele).
            For the exact files produced by this run, download its build artifact.
            Each application starts in demo; one purchase unlocks all instruments within the purchased application.
            Release AABs embed their R8 mapping. Keep each matching *-mapping.txt with its AAB for crash diagnosis.
          prerelease: false
          files: |
            dist/*.aab
            dist/*-mapping.txt

  publish-play:
    name: "Play · ${{ matrix.instrument }} · ${{ inputs.publish }}"
    needs: build
    if: inputs.publish != 'build-only' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.play-matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the signed bundles from this run
        uses: actions/download-artifact@v7
        with:
          name: fretboard-hero-android-${{ inputs.instrument }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: dist
      - name: Check Google Play configuration
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          : "${PROVIDER:?Set the GCP_WORKLOAD_IDENTITY_PROVIDER Actions secret}"
          : "${SERVICE_ACCOUNT:?Set the GOOGLE_PLAY_SERVICE_ACCOUNT Actions secret}"
      - name: Authenticate to Google Play
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit release and read Google Play status
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          BUILD_INSTRUMENT: ${{ matrix.instrument }}
          PLAY_TRACK: ${{ inputs.publish }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/google-play/publish.cjs
