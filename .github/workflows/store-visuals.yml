name: Google Play visual export

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Google Play locale
        type: choice
        options: [fr-FR, en-US]
        default: fr-FR
        required: true

concurrency:
  group: store-visuals-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STORE_LOCALE: ${{ inputs.locale || 'fr-FR' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stores/tools/package-lock.json
      - run: npm --prefix stores/tools ci --no-audit --no-fund
      - run: npx --prefix stores/tools playwright install --with-deps chromium
      - name: Capture the real localized application
        run: node stores/tools/capture.cjs
      - name: Render phone artwork and preserve the existing application icon
        run: |
          node stores/tools/render.cjs
          node stores/tools/export-feature.cjs "stores/google-play/guitar/$STORE_LOCALE"
          mkdir -p "stores/google-play/guitar/$STORE_LOCALE/icon"
          if [ "$STORE_LOCALE" != en-US ]; then
            cp stores/google-play/guitar/en-US/icon/app-icon-512x512.png "stores/google-play/guitar/$STORE_LOCALE/icon/app-icon-512x512.png"
          fi
      - name: Validate exported images
        run: node stores/tools/validate.cjs "stores/google-play/guitar/$STORE_LOCALE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guitar-google-play-${{ env.STORE_LOCALE }}
          path: stores/google-play/guitar/${{ env.STORE_LOCALE }}/
          retention-days: 7
