name: Google Play visual export

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Instrument
        type: choice
        options: [guitar, bass, ukulele]
        default: guitar
        required: true
      locale:
        description: Google Play locale (bass and ukulele currently support en-US artwork)
        type: choice
        options: [fr-FR, en-US]
        default: fr-FR
        required: true

concurrency:
  group: store-visuals-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORE_LOCALE: ${{ inputs.locale || 'fr-FR' }}
      STORE_INSTRUMENTS: ${{ inputs.instrument || 'guitar' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stores/tools/package-lock.json
      - run: npm --prefix stores/tools ci --no-audit --no-fund
      - run: npx --prefix stores/tools playwright install --with-deps chromium
      - name: Capture, render and validate the requested instruments
        id: export
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'artifact_paths<<STORE_PATHS'
            for instrument in $STORE_INSTRUMENTS; do
              echo "stores/google-play/$instrument/$STORE_LOCALE/"
            done
            echo STORE_PATHS
          } >> "$GITHUB_OUTPUT"
          for STORE_INSTRUMENT in $STORE_INSTRUMENTS; do
            export STORE_INSTRUMENT
            listing="stores/google-play/$STORE_INSTRUMENT/$STORE_LOCALE"
            test -f "$listing/source/layout/panorama.html"
            node stores/tools/capture.cjs
            node stores/tools/render.cjs
            node stores/tools/export-feature.cjs "$listing"
            node stores/tools/export-icon.cjs
            node stores/tools/validate.cjs "$listing"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-play-${{ env.STORE_LOCALE }}
          path: ${{ steps.export.outputs.artifact_paths }}
          retention-days: 7
