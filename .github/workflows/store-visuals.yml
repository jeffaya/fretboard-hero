name: Google Play visual export

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Instrument
        type: choice
        options: [guitar, bass, ukulele]
        default: guitar
        required: true
      locale:
        description: Google Play locale
        type: choice
        options: [fr-FR, en-US]
        default: fr-FR
        required: true
  pull_request:
    paths:
      - stores/google-play/bass/fr-FR/source/**
      - stores/google-play/ukulele/fr-FR/source/**
      - .github/workflows/store-visuals.yml

concurrency:
  group: store-visuals-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/bass-ukulele-en-store-visuals' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORE_LOCALE: ${{ inputs.locale || 'fr-FR' }}
      STORE_INSTRUMENTS: ${{ github.event_name == 'pull_request' && 'bass ukulele' || inputs.instrument || 'guitar' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stores/tools/package-lock.json
      - run: npm --prefix stores/tools ci --no-audit --no-fund
      - run: npx --prefix stores/tools playwright install --with-deps chromium
      - name: Capture, render and validate the requested instruments
        id: export
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'artifact_paths<<STORE_PATHS'
            for instrument in $STORE_INSTRUMENTS; do
              echo "stores/google-play/$instrument/$STORE_LOCALE/"
            done
            echo STORE_PATHS
          } >> "$GITHUB_OUTPUT"
          for STORE_INSTRUMENT in $STORE_INSTRUMENTS; do
            export STORE_INSTRUMENT
            listing="stores/google-play/$STORE_INSTRUMENT/$STORE_LOCALE"
            test -f "$listing/source/layout/panorama.html"
            node stores/tools/capture.cjs
            node stores/tools/render.cjs
            node stores/tools/export-feature.cjs "$listing"
            node stores/tools/export-icon.cjs
            node stores/tools/validate.cjs "$listing"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-play-${{ env.STORE_LOCALE }}
          path: ${{ steps.export.outputs.artifact_paths }}
          retention-days: 7
      - name: Save the requested French visuals to their PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stores/google-play/bass/fr-FR stores/google-play/ukulele/fr-FR
          if ! git diff --cached --quiet; then
            git commit -m 'Add French bass and ukulele Google Play visuals'
            git push origin HEAD:codex/bass-ukulele-en-store-visuals
          fi
