name: Check Android release mapping

on:
  pull_request:
    paths:
      - 'app/android/**'
      - 'app/package*.json'
      - 'app/tests/android-mapping.test.cjs'
      - 'scripts/**'
      - '.github/workflows/check-android-release.yml'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:

permissions:
  contents: read
env:
  POWERSHELL_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release-mapping:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Mapping regression tests
        run: node --test app/tests/android-mapping.test.cjs
      - name: Temporary signing for CI validation only
        shell: pwsh
        run: |
          # No production credentials, no publishing, no APK/AAB artifact upload.
          keytool -genkeypair -keystore app/android/app/ci-only.keystore -storepass android -keypass android -alias ci-only -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Fretboard Hero CI only'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create temporary CI signing key' }
          [IO.File]::WriteAllLines('app/android/keystore.properties', @('storeFile=ci-only.keystore', 'storePassword=android', 'keyAlias=ci-only', 'keyPassword=android'), [Text.UTF8Encoding]::new($false))
      - name: Build and validate all three minified release APKs and AABs
        shell: pwsh
        run: .\scripts\build-all.ps1 -Profile Store -BuildType Release -Format Both -VersionCode 1 -VersionName 1.0.0-ci
      - name: Native purchase-cache regression tests
        shell: pwsh
        working-directory: app/android
        run: |
          ./gradlew.bat --no-scan testDebugUnitTest
          if ($LASTEXITCODE -ne 0) { throw 'Native billing tests failed' }
      - name: Remove temporary packages and signing files
        if: always()
        shell: pwsh
        run: |
          Remove-Item app/android/keystore.properties, app/android/app/ci-only.keystore -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
