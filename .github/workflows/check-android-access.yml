name: Check store and preview access
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'app/**'
      - 'server/**'
      - '.github/workflows/check-android-access.yml'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  POWERSHELL_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Access, native sync and package regression tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem web/tests/*.test.cjs, app/tests/*.test.cjs, app/tests/*.test.js, server/tests/*.test.mjs
          node --test $tests.FullName
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }
