name: Build three Android apps (Store and Preview)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-preview-apk.yml'
      - 'app/**'
      - 'scripts/**'
      - 'web/core/native-billing.js'
      - 'web/core/access.js'
      - 'server/**'

permissions:
  contents: read

env:
  CI: 'true'
  POWERSHELL_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        instrument: [guitar, bass-4, ukulele]
    env:
      INSTRUMENT: ${{ matrix.instrument }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Disable Android tool analytics before setup
        shell: pwsh
        run: |
          $androidHome = Join-Path $env:USERPROFILE '.android'
          New-Item -ItemType Directory -Path $androidHome -Force | Out-Null
          $settings = @{
            userId = [guid]::NewGuid().ToString()
            optedIn = $false
            saltValue = [guid]::NewGuid().ToString()
            saltSkew = 0
            debugDisablePublishing = $true
          }
          $settings | ConvertTo-Json | Set-Content (Join-Path $androidHome 'analytics.settings') -Encoding utf8NoBOM

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }

      - name: Install app dependencies without audit uploads
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Disable Capacitor telemetry
        working-directory: app
        run: node node_modules/@capacitor/cli/bin/capacitor telemetry off

      - name: Run regression tests before packaging
        if: matrix.instrument == 'guitar'
        shell: pwsh
        run: |
          $tests = Get-ChildItem web/tests/*.test.cjs, app/tests/*.test.cjs, app/tests/*.test.js, server/tests/*.test.mjs
          node --test $tests.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed; refusing to package the app' }

      - name: Build an unlocked, debug-signed Preview APK
        shell: pwsh
        run: |
          ./scripts/build-instrument.ps1 -Instrument $env:INSTRUMENT -Profile Preview -BuildType Debug -Format Apk -VersionCode 7 -VersionName '1.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'APK build failed' }

      - name: Verify signature, identity and preview access
        shell: pwsh
        run: |
          $apk = "dist/fretboard-hero-$env:INSTRUMENT-preview-debug.apk"
          $entry = (Get-Content app/instruments.json -Raw | ConvertFrom-Json).($env:INSTRUMENT)
          $appId = "$($entry.appId).preview"
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $badging = & (Join-Path $buildTools 'aapt.exe') dump badging $apk
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect APK metadata' }
          if (-not ($badging | Select-String -SimpleMatch "package: name='$appId'")) { throw 'Wrong APK application ID' }
          $permissions = & (Join-Path $buildTools 'aapt.exe') dump permissions $apk
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect APK permissions' }
          foreach ($permission in @('android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS')) {
            if (-not ($permissions | Select-String -SimpleMatch $permission)) { throw "Missing APK permission: $permission" }
          }
          ./scripts/validate-android-access.ps1 -Path $apk -Instrument $env:INSTRUMENT -Profile Preview
          $info = @{
            sourceCommit = (git rev-parse HEAD)
            appId = $appId
            instrument = $env:INSTRUMENT
            versionName = '1.1.0'
            versionCode = 7
            signing = 'debug'
            fullyUnlocked = $true
            sha256 = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $info | ConvertTo-Json | Set-Content "dist/$env:INSTRUMENT-preview-build-info.json" -Encoding utf8NoBOM

      - name: Build Store APK and AAB with demo access
        shell: pwsh
        run: |
          ./scripts/build-instrument.ps1 -Instrument $env:INSTRUMENT -Profile Store -BuildType Debug -Format Both -VersionCode 7 -VersionName '1.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Store build failed' }
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          $apk = "dist/fretboard-hero-$env:INSTRUMENT-store-debug.apk"
          $appId = (Get-Content app/instruments.json -Raw | ConvertFrom-Json).($env:INSTRUMENT).appId
          $badging = & (Join-Path $buildTools 'aapt.exe') dump badging $apk
          if ($LASTEXITCODE -ne 0 -or -not ($badging | Select-String -SimpleMatch "package: name='$appId'")) { throw 'Wrong Store application ID' }
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw 'Store test APK signature verification failed' }

      - name: Native purchase-cache regression tests
        working-directory: app/android
        shell: pwsh
        run: |
          ./gradlew.bat --no-scan testDebugUnitTest
          if ($LASTEXITCODE -ne 0) { throw 'Native billing tests failed' }

      - name: Upload Store test packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.instrument }}-store-test-packages
          path: |
            dist/fretboard-hero-${{ matrix.instrument }}-store-debug.apk
            dist/fretboard-hero-${{ matrix.instrument }}-store-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload the APK and build identity
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.instrument }}-preview-apk
          path: |
            dist/fretboard-hero-${{ matrix.instrument }}-preview-debug.apk
            dist/${{ matrix.instrument }}-preview-build-info.json
          if-no-files-found: error
          retention-days: 14
