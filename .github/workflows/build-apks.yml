name: Build Android APKs and AABs

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (integer, higher than the last Play upload)"
        required: true
        type: string
      version_name:
        description: "Public version name (e.g. 1.1.0)"
        required: true
        default: "1.0.0"
        type: string
      format:
        description: "Packages to generate"
        required: true
        default: Both
        type: choice
        options: [Both, Apk, Aab]

# Avoid overlapping updates to the rolling Android release.
concurrency:
  group: android-distribution
  cancel-in-progress: false

jobs:
  build-apks:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        shell: pwsh
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ($env:VERSION_CODE -notmatch '^[1-9][0-9]{0,9}$' -or [long]$env:VERSION_CODE -gt 2100000000) {
            throw "version_code must be an integer between 1 and 2100000000"
          }
          if ($env:VERSION_NAME -notmatch '^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][A-Za-z0-9]+)*$') {
            throw "version_name must look like 1.0 or 1.0.0"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Set up release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing signing secret: $name" }
          }
          # Java .properties interprets backslashes, whitespace and Unicode escapes.
          function Escape-Property([string]$value) {
            $escaped = foreach ($char in $value.ToCharArray()) { '\u{0:x4}' -f [int]$char }
            return ($escaped -join '')
          }
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("app/android/app/release.keystore", $bytes)
          $lines = @(
            'storeFile=release.keystore'
            "storePassword=$(Escape-Property $env:ANDROID_KEYSTORE_PASSWORD)"
            "keyAlias=$(Escape-Property $env:ANDROID_KEY_ALIAS)"
            "keyPassword=$(Escape-Property $env:ANDROID_KEY_PASSWORD)"
          )
          [IO.File]::WriteAllLines("app/android/keystore.properties", $lines, [Text.UTF8Encoding]::new($false))

      - name: Build all instrument packages (release, signed)
        shell: pwsh
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          PACKAGE_FORMAT: ${{ inputs.format }}
        run: .\scripts\build-all.ps1 -BuildType Release -Format $env:PACKAGE_FORMAT -VersionCode $env:VERSION_CODE -VersionName $env:VERSION_NAME

      - name: Remove signing files
        if: always()
        shell: pwsh
        run: |
          Remove-Item app/android/keystore.properties, app/android/app/release.keystore -Force -ErrorAction SilentlyContinue

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fretboard-hero-android-${{ inputs.version_code }}
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "Android APKs and AABs"
          body: |
            Signed Android packages built from commit ${{ github.sha }}.
            Version ${{ inputs.version_name }} (code ${{ inputs.version_code }}).
            Formats included in this run: ${{ inputs.format }}. Other formats on this rolling release may come from an earlier run; use this run's artifacts for a consistent set.
            Guitar, Bass and Ukulele Fretboard Hero.
            APK: direct installation. AAB: Google Play Console upload.
          prerelease: false
          files: |
            dist/*.apk
            dist/*.aab
