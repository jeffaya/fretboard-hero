name: Build Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-apks:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Set up release signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes("app/android/app/release.keystore", $bytes)
          $lines = @(
            "storeFile=release.keystore",
            "storePassword=$env:ANDROID_KEYSTORE_PASSWORD",
            "keyAlias=$env:ANDROID_KEY_ALIAS",
            "keyPassword=$env:ANDROID_KEY_PASSWORD"
          )
          Set-Content -Path "app/android/keystore.properties" -Value $lines -Encoding UTF8

      - name: Build all instrument APKs (release, signed)
        shell: pwsh
        run: .\scripts\build-all.ps1 -BuildType Release

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fretboard-hero-apks
          path: dist/*.apk

      - name: Publish rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: "Android APKs"
          body: |
            Signed release APKs auto-built from commit ${{ github.sha }} on `main`.
            Guitar, Bass and Ukulele Fretboard Hero.
          prerelease: false
          files: dist/*.apk
